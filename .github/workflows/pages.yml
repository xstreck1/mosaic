name: Deploy Mosaic to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          for file in static/*.js; do node --check "$file"; done
          node --test tests/*.test.js
      - name: Check static server
        run: python -m unittest discover -s tests -v
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Version browser assets
        run: |
          python - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          shutil.copytree("static", "_site")
          version = os.environ["GITHUB_SHA"]
          asset = re.compile(r"(\./[A-Za-z0-9_./-]+\.(?:js|css))(?=[\"'])")
          for path in Path("_site").rglob("*"):
              if path.suffix not in (".html", ".js"):
                  continue
              source = path.read_text(encoding="utf-8")
              path.write_text(asset.sub(lambda match: f"{match[1]}?v={version}", source), encoding="utf-8")
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
